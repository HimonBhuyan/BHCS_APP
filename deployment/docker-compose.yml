version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bluehour_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blue_hour_hq
      POSTGRES_USER: bluehour
      POSTGRES_PASSWORD: ${DB_PASSWORD:-BlueHourSecret2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/database/postgresql_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  redis:
    image: redis:7-alpine
    container_name: bluehour_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:

