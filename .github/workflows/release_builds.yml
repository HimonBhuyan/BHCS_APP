name: Blue Hour HQ — Android & iOS Cloud Release Builds

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build_android:
    name: Build Shareable Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build Android Release APK
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee /tmp/android_build.log; then
            ERR_TAIL=$(tail -n 25 /tmp/android_build.log | tr '\n' ' ' | cut -c1-1200)
            echo "::error title=Android Gradle Failure::$ERR_TAIL"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: BlueHourHQ-Android-Release
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

  build_ios:
    name: Build iOS Bundle & Unsigned IPA (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true
      - run: flutter precache --ios
      - run: flutter pub get
      - run: flutter build ios --config-only --release --no-codesign
      - run: |
          cd ios
          pod install --repo-update
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r BlueHourHQ-iOS-Unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BlueHourHQ-iOS-IPA
          path: mobile_app/BlueHourHQ-iOS-Unsigned.ipa

  publish_release:
    name: Publish Direct Download Links (GitHub Releases)
    needs: [build_ios, build_android]
    if: always() && needs.build_ios.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: BlueHourHQ-*
          merge-multiple: true
      - name: Rename release files cleanly
        run: |
          ls -la
          if [ -f app-release.apk ]; then mv app-release.apk BlueHourHQ-Android-Release.apk; fi
      - name: Create Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-latest
          name: Blue Hour HQ — Latest Android & iOS Builds
          body: |
            ### Direct Shareable Installers for Blue Hour Creative Studios Founders
            - **Android**: Download `BlueHourHQ-Android-Release.apk` and install on any Android phone.
            - **iOS (iPhone)**: Download `BlueHourHQ-iOS-Unsigned.ipa` (install via AltStore / Sideloadly, or re-sign for TestFlight / App Store).
          prerelease: true
          make_latest: true
          files: |
            BlueHourHQ-iOS-Unsigned.ipa
            BlueHourHQ-Android-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
